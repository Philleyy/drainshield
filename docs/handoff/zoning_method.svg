<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 556' width='760' height='556' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Zones group basins that behave alike, and one sensor speaks for each zone'><rect id='bg' x='0' y='0' width='760' height='556' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Zones group basins that behave alike, and one sensor speaks for each zone</text><text x='24' y='52' font-size='11.5' fill='#57606a'>A method the algorithm suggests and the foreman corrects. Step 2 can start as simple rules, then improve.</text><rect x='24' y='76' width='372' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>1  Describe every basin</text><text x='36' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>leaf cover, low point, catchment area, distance</text><text x='36' y='132' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>to the outfall, past problems, what drains in</text><path d='M210 148 V170' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='172' width='372' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='196' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>2  Group neighbours that behave alike</text><text x='36' y='212' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>same drainage branch + similar profile;</text><text x='36' y='228' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>a zone ≈ one half-day batch of cleaning</text><path d='M210 244 V266' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='268' width='372' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='292' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>3  The foreman reviews it on the map</text><text x='36' y='308' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>merge, split or redraw zones:</text><text x='36' y='324' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>his knowledge of the territory wins</text><path d='M210 340 V362' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='364' width='372' height='72' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='388' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4  One sensor per zone</text><text x='36' y='404' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>in the basin likely to fail first,</text><text x='36' y='420' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>so the zone gets the earliest warning</text><path d='M210 436 V458' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='460' width='372' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='484' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>5  Check after every batch</text><text x='36' y='500' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>what the cleaners found, basin by basin, vs</text><text x='36' y='516' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>what the sensor said: split zones that disagree</text><path d='M24 496 H12 V208 H22' fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4' marker-end='url(#arrow)'/><rect x='424' y='76' width='312' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='436' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Free data to start from</text><text x='436' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Québec lidar: terrain + canopy height, 1 m</text><text x='436' y='132' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>city basin inventory and sewer network</text><text x='436' y='148' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>cleaning, complaint and flood records</text><path d='M424 112 H398' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='424' y='196' width='312' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='436' y='220' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Groups follow the pipes</text><text x='436' y='236' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basins only join a zone if their water ends up</text><text x='436' y='252' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>in the same branch, so one sensor sees it</text><path d='M424 232 H398' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='424' y='364' width='312' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='436' y='388' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Worst first, not average</text><text x='436' y='404' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>a sensor in the zone's weakest basin warns</text><text x='436' y='420' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>before the others fill up</text><path d='M424 400 H398' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='424' y='460' width='312' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='436' y='484' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Each zone shows a confidence</text><text x='436' y='500' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Low until a few batches agree with its sensor</text><path d='M424 488 H398' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/></svg>