<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 308' width='760' height='308' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='If Raph starts from scratch, this is what to carry over'><rect id='bg' x='0' y='0' width='760' height='308' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>If Raph starts from scratch, this is what to carry over</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Most of the value is in the rules, the data and the tests, not in the website code.</text><rect x='24' y='72' width='170' height='184' rx='8' fill='none' stroke='#1a7f37' stroke-width='1.5'/><circle cx='44' cy='92' r='11' fill='#1a7f37'/><text x='44' y='97' font-size='13' font-weight='700' fill='#ffffff' text-anchor='middle'>✓</text><text x='62' y='97' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Reuse as is</text><text x='36' y='128' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• data/municipal_basins.csv</text><text x='36' y='148' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• data/basin_priorities.csv</text><text x='36' y='168' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• French text: fr.ts, fr.py</text><text x='36' y='188' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• route_optimizer.py</text><text x='36' y='208' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• arduino/ sketches</text><text x='36' y='228' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• hardware/ (pod CAD)</text><text x='36' y='248' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• tests/ as the spec</text><rect x='206' y='72' width='170' height='184' rx='8' fill='none' stroke='#0969da' stroke-width='1.5'/><circle cx='226' cy='92' r='11' fill='#0969da'/><text x='226' y='97' font-size='13' font-weight='700' fill='#ffffff' text-anchor='middle'>↻</text><text x='244' y='97' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Port the rules</text><text x='218' y='128' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• processing.py (diagnosis)</text><text x='218' y='148' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• predictive.py (prediction)</text><text x='218' y='168' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• polling_controller.py</text><text x='218' y='188' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• web/server/season.py</text><text x='218' y='208' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• ingest contract</text><text x='218' y='228' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• security.py ideas</text><text x='218' y='248' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>(hashing, upload keys)</text><rect x='388' y='72' width='170' height='184' rx='8' fill='none' stroke='#bc4c00' stroke-width='1.5'/><circle cx='408' cy='92' r='11' fill='#bc4c00'/><text x='408' y='97' font-size='13' font-weight='700' fill='#ffffff' text-anchor='middle'>✎</text><text x='426' y='97' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Rewrite</text><text x='400' y='128' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• web/server/state.py + shim</text><text x='400' y='148' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• React pages (3 screens)</text><text x='400' y='168' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• data_store.py (CSV files)</text><text x='400' y='188' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• accounts → role picker</text><text x='400' y='208' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• Streamlit dashboard</text><rect x='570' y='72' width='170' height='184' rx='8' fill='none' stroke='#6e7781' stroke-width='1.5'/><circle cx='590' cy='92' r='11' fill='#6e7781'/><text x='590' y='97' font-size='13' font-weight='700' fill='#ffffff' text-anchor='middle'>✕</text><text x='608' y='97' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Drop when moving</text><text x='582' y='128' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• cloudflare-relay/ (if new</text><text x='582' y='148' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>host works at McGill)</text><text x='582' y='168' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• Claude outputs/ (duplicate)</text><text x='582' y='188' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>• bridge scripts, once</text><text x='582' y='208' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>sensors upload directly</text><text x='24' y='284' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Phil's advice: look at what's built, then start fresh and pull these pieces in.</text></svg>