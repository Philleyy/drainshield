<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 432' width='760' height='432' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Each monitored basin gets exactly one colour: the first rule that matches'><rect id='bg' x='0' y='0' width='760' height='432' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Each monitored basin gets exactly one colour: the first rule that matches</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Grey is a sensor problem, never shown as a basin problem. Code: data_store.triage().</text><rect x='24' y='76' width='440' height='48' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor iced, or silent for more than 60 min?</text><path d='M464 100 H494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='479' y='93' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='498' y='86' width='238' height='28' rx='14' fill='#6e7781' fill-opacity='0.12' stroke='#6e7781' stroke-width='1.5'/><circle cx='514' cy='100' r='5' fill='#6e7781'/><text x='526' y='104.5' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>Offline: check the sensor</text><path d='M80 124 V146' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='88' y='139' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no</text><rect x='24' y='148' width='440' height='48' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='172' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Water backing up now, or stuck high in dry weather?</text><path d='M464 172 H494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='479' y='165' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='498' y='158' width='238' height='28' rx='14' fill='#cf222e' fill-opacity='0.12' stroke='#cf222e' stroke-width='1.5'/><circle cx='514' cy='172' r='5' fill='#cf222e'/><text x='526' y='176.5' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>Urgent: flooding now</text><path d='M80 196 V218' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='88' y='211' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no</text><rect x='24' y='220' width='440' height='48' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='244' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Maintenance flag and ≥ 15 mm of rain in the next 12 h?</text><path d='M464 244 H494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='479' y='237' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='498' y='230' width='238' height='28' rx='14' fill='#cf222e' fill-opacity='0.12' stroke='#cf222e' stroke-width='1.5'/><circle cx='514' cy='244' r='5' fill='#cf222e'/><text x='526' y='248.5' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>Urgent: clean before storm</text><path d='M80 268 V290' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='88' y='283' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no</text><rect x='24' y='292' width='440' height='48' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='316' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Any maintenance flag (watch, clean soon, urgent)?</text><path d='M464 316 H494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='479' y='309' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='498' y='302' width='238' height='28' rx='14' fill='#bc4c00' fill-opacity='0.12' stroke='#bc4c00' stroke-width='1.5'/><circle cx='514' cy='316' r='5' fill='#bc4c00'/><text x='526' y='320.5' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>Inspect</text><path d='M80 340 V362' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='88' y='355' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no</text><rect x='24' y='364' width='238' height='28' rx='14' fill='#1a7f37' fill-opacity='0.12' stroke='#1a7f37' stroke-width='1.5'/><circle cx='40' cy='378' r='5' fill='#1a7f37'/><text x='52' y='382.5' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>Normal: no action</text><text x='24' y='416' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Heavy rain is 10 mm instead of 15 mm in spring (Mar 15–May 31) and fall (Sep 15–Nov 30).</text></svg>