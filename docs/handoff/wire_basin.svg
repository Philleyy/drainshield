 invert</text><text x='142' y='438' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='end'>−1.70 floor</text><rect x='356' y='236' width='364' height='96' rx='8' fill='none' stroke='#d0d7de'/><text x='368' y='256' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>WATER LEVEL NOW</text><text x='368' y='286' font-size='17' font-weight='600' fill='#1a7f37' text-anchor='start'>1.31 m below street</text><text x='368' y='308' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>normal level, draining</text><rect x='356' y='344' width='364' height='96' rx='8' fill='none' stroke='#d0d7de'/><text x='368' y='364' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>DRAINAGE PERFORMANCE</text><text x='368' y='394' font-size='17' font-weight='600' fill='#bc4c00' text-anchor='start'>Slow · ~35% capacity</text><text x='368' y='416' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>est. sediment 70% of sump</text><rect x='40' y='460' width='680' height='32' rx='8' fill='#eef1f4'/><text x='52' y='481' font-size='11.5' font-weight='600' fill='#1f2328' text-anchor='start'>▸ History (engineering view): rain vs water level, storm table, maintenance log</text><rect x='40' y='500' width='140' height='32' rx='8' fill='#0969da'/><text x='110' y='521' font-size='12' font-weight='600' fill='#ffffff' text-anchor='middle'>Log maintenance</text></svg>