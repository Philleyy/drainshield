<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 448' width='760' height='448' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Batches go out when there&apos;s enough work, not for a few scattered basins'><rect id='bg' x='0' y='0' width='760' height='448' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Batches go out when there's enough work, not for a few scattered basins</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Half a day is a rule of thumb from Chambly; a full day works the same way.</text><text x='40' y='84' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>One batch: half a day (4 h) to a full day (8 h), same idea either way</text><rect x='40' y='96' width='340.0' height='24' fill='#0969da' fill-opacity='0.7'/><rect x='380.0' y='96' width='340.0' height='24' fill='#0969da' fill-opacity='0.3'/><rect x='40' y='96' width='680' height='24' fill='none' stroke='#8c959f'/><path d='M40.0 120 V126' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='40.0' y='140' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>0 h</text><path d='M210.0 120 V126' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='210.0' y='140' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>2 h</text><path d='M380.0 120 V126' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='380.0' y='140' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>4 h</text><path d='M550.0 120 V126' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='550.0' y='140' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>6 h</text><path d='M720.0 120 V126' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='720.0' y='140' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>8 h</text><text x='210.0' y='112' font-size='11.5' font-weight='700' fill='#ffffff' text-anchor='middle'>≈ 33 basins</text><text x='550.0' y='112' font-size='11.5' font-weight='700' fill='#1f2328' text-anchor='middle'>≈ 70 basins</text><text x='40' y='160' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>At ≈ 5 min per basin (Chambly foreman) + ~1 min between neighbours; yard trips are placeholders.</text><rect x='24' y='200' width='256' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='224' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Flagged work piles up</text><text x='36' y='240' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>zones whose sensor flags them</text><path d='M280 228 H318' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><polygon points='320,228 440,186 560,228 440,270' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='440' y='224' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>Enough clustered work</text><text x='440' y='240' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>for ≥ half a day?</text><path d='M560 228 H578' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='569' y='220' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='580' y='192' width='156' height='72' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='592' y='216' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Send a batch</text><text x='592' y='232' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>whole zones,</text><text x='592' y='248' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>urgent first</text><path d='M440 270 V306' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='448' y='292' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no</text><polygon points='320,350 440,308 560,350 440,392' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='440' y='346' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>Urgent before</text><text x='440' y='362' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>a storm?</text><path d='M560 350 H578' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='569' y='342' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>yes</text><rect x='580' y='314' width='156' height='72' rx='8' fill='#cf222e' fill-opacity='0.10' stroke='#cf222e' stroke-width='2'/><text x='592' y='338' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Small urgent run</text><text x='592' y='354' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>city crew, or add to</text><text x='592' y='370' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>a batch already out</text><path d='M320 350 H282' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='301' y='342' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>no</text><rect x='24' y='322' width='256' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='346' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Wait</text><text x='36' y='362' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>joins the next batch nearby</text><text x='24' y='424' font-size='11.5' font-weight='600' fill='#1f2328' text-anchor='start'>Never send a contractor for a few scattered, non-critical basins: they wait for a batch nearby.</text></svg>