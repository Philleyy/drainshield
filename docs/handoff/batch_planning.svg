t x='572.7' y='96' width='14.2' height='28' fill='#0969da' fill-opacity='0.75'/><rect x='586.8' y='96' width='2.8' height='28' fill='#0969da' fill-opacity='0.2'/><rect x='589.7' y='96' width='14.2' height='28' fill='#0969da' fill-opacity='0.75'/><rect x='603.8' y='96' width='2.8' height='28' fill='#0969da' fill-opacity='0.2'/><rect x='606.7' y='96' width='14.2' height='28' fill='#0969da' fill-opacity='0.75'/><rect x='620.8' y='96' width='2.8' height='28' fill='#0969da' fill-opacity='0.2'/><rect x='623.7' y='96' width='14.2' height='28' fill='#0969da' fill-opacity='0.75'/><rect x='637.8' y='96' width='2.8' height='28' fill='#0969da' fill-opacity='0.2'/><rect x='640.7' y='96' width='14.2' height='28' fill='#0969da' fill-opacity='0.75'/><rect x='654.8' y='96' width='2.8' height='28' fill='#0969da' fill-opacity='0.2'/><rect x='657.7' y='96' width='62.3' height='28' fill='#6e7781' fill-opacity='0.35'/><rect x='40' y='96' width='680' height='28' fill='none' stroke='#8c959f'/><path d='M40.0 124 V130' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='40.0' y='144' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>0 h</text><path d='M210.0 124 V130' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='210.0' y='144' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>1 h</text><path d='M380.0 124 V130' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='380.0' y='144' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>2 h</text><path d='M550.0 124 V130' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='550.0' y='144' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>3 h</text><path d='M720.0 124 V130' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='720.0' y='144' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>4 h</text><text x='68.33333333333334' y='162' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>drive from the yard</text><text x='380.0' y='162' font-size='11.5' font-weight='600' fill='#1f2328' text-anchor='middle'>≈ 33 basins × (5 min cleaning + ~1 min to the next one)</text><text x='688.8333333333334' y='162' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>drive back</text><text x='40' y='184' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>5 min per basin comes from Chambly's public works foreman. The driving times are placeholders that the city sets once.</text><rect x='24' y='222' width='224' height='56' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='246' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>1  Zones flagged first</text><text x='36' y='262' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>by their sensor, urgent first</text><path d='M248 250 H266' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='268' y='222' width='224' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='280' y='246' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>2  Every basin in them</text><text x='280' y='262' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>not just the sensor's basin</text><path d='M492 250 H510' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='512' y='222' width='224' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='524' y='246' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>3  Fill the half day</text><text x='524' y='262' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>with the nearest at-risk zones</text><path d='M624 278 V354 H494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='268' y='318' width='224' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='280' y='342' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4  Route + printed sheet</text><text x='280' y='358' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>paper sheet for the contractor,</text><text x='280' y='374' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>phone for city crews</text><rect x='24' y='318' width='224' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='342' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>5  Foreman logs it after</text><text x='36' y='358' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>"all cleaned", then untick exceptions</text><path d='M268 354 H250' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='24' y='410' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>The contractor (e.g. Sani-Vac) keeps working on paper; the city enters the result afterwards.</text></svg>