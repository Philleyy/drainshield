<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 616' width='760' height='616' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='The crew screen does one thing: show the next basin and a big "done" button'><rect id='bg' x='0' y='0' width='760' height='616' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>The crew screen does one thing: show the next basin and a big "done" button</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Phone on the left, tablet on the right. Street names are placeholders.</text><rect x='24' y='72' width='268' height='520' rx='26' fill='#ffffff' stroke='#1f2328' stroke-width='2'/><rect x='128.0' y='82' width='60' height='6' rx='3' fill='#d0d7de'/><text x='44' y='120' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>Lot · mar. 18 nov.</text><text x='44' y='144' font-size='20' font-weight='700' fill='#1f2328' text-anchor='start'>Zone B</text><rect x='44' y='156' width='228' height='10' rx='5' fill='#d0d7de'/><rect x='44' y='156' width='83' height='10' rx='5' fill='#1a7f37'/><text x='44' y='184' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>12 sur 33 faits</text><rect x='44' y='196' width='228' height='132' rx='14' fill='#eef1f4'/><text x='60' y='220' font-size='10.5' font-weight='700' fill='#57606a' text-anchor='start'>PROCHAIN</text><text x='60' y='246' font-size='22' font-weight='700' fill='#1f2328' text-anchor='start'>B-14</text><text x='60' y='268' font-size='12' font-weight='400' fill='#1f2328' text-anchor='start'>devant le 12, rue des Érables</text><text x='60' y='300' font-size='13' font-weight='700' fill='#0969da' text-anchor='start'>Itinéraire ›</text><rect x='44' y='342' width='228' height='72' rx='10' fill='#1a7f37' stroke='#1a7f37' stroke-width='1.5'/><text x='158.0' y='384.6666666666667' font-size='20' font-weight='700' fill='#ffffff' text-anchor='middle'>✓  Nettoyé</text><rect x='44' y='424' width='110' height='48' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='99.0' y='452.6666666666667' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Problème</text><rect x='162' y='424' width='110' height='48' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='217.0' y='452.6666666666667' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Sauter</text><text x='48' y='500' font-size='12' font-weight='400' fill='#57606a' text-anchor='start'>2.  B-15 · rue des Érables</text><text x='48' y='522' font-size='12' font-weight='400' fill='#57606a' text-anchor='start'>3.  B-16 · rue des Pins</text><rect x='316' y='72' width='420' height='320' rx='20' fill='#ffffff' stroke='#1f2328' stroke-width='2'/><rect x='332' y='88' width='196' height='288' rx='8' fill='#eef1f4'/><path d='M350 330 L372 290 L404 300 L420 250 L452 236 L470 196 L440 160 L400 130' fill='none' stroke='#0969da' stroke-width='3'/><circle cx='350' cy='330' r='9' fill='#1a7f37' stroke='#1a7f37' stroke-width='1.5'/><text x='350' y='334' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>✓</text><circle cx='372' cy='290' r='9' fill='#1a7f37' stroke='#1a7f37' stroke-width='1.5'/><text x='372' y='294' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>✓</text><circle cx='404' cy='300' r='9' fill='#1a7f37' stroke='#1a7f37' stroke-width='1.5'/><text x='404' y='304' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>✓</text><circle cx='420' cy='250' r='9' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='420' y='254' font-size='10' font-weight='700' fill='#1f2328' text-anchor='middle'>13</text><circle cx='452' cy='236' r='9' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='452' y='240' font-size='10' font-weight='700' fill='#1f2328' text-anchor='middle'>14</text><circle cx='470' cy='196' r='9' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='470' y='200' font-size='10' font-weight='700' fill='#1f2328' text-anchor='middle'>15</text><circle cx='440' cy='160' r='9' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='440' y='164' font-size='10' font-weight='700' fill='#1f2328' text-anchor='middle'>16</text><circle cx='400' cy='130' r='9' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='400' y='134' font-size='10' font-weight='700' fill='#1f2328' text-anchor='middle'>17</text><text x='544' y='112' font-size='14' font-weight='700' fill='#1f2328' text-anchor='start'>Zone B · 12 sur 33</text><rect x='544' y='128' width='176' height='100' rx='12' fill='#eef1f4'/><text x='558' y='152' font-size='10.5' font-weight='700' fill='#57606a' text-anchor='start'>PROCHAIN</text><text x='558' y='176' font-size='20' font-weight='700' fill='#1f2328' text-anchor='start'>B-14</text><text x='558' y='198' font-size='12' font-weight='400' fill='#1f2328' text-anchor='start'>12, rue des Érables</text><text x='558' y='218' font-size='12' font-weight='700' fill='#0969da' text-anchor='start'>Itinéraire ›</text><rect x='544' y='240' width='176' height='64' rx='10' fill='#1a7f37' stroke='#1a7f37' stroke-width='1.5'/><text x='632.0' y='278.0' font-size='18' font-weight='700' fill='#ffffff' text-anchor='middle'>✓  Nettoyé</text><rect x='544' y='314' width='84' height='44' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='586.0' y='340.0' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>Problème</text><rect x='636' y='314' width='84' height='44' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='678.0' y='340.0' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>Sauter</text><text x='316' y='424' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Design rules for the crew screen</text><text x='316' y='448' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>•  One basin at a time, with one big button</text><text x='316' y='470' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>•  Buttons at least 56 px tall: usable with gloves</text><text x='316' y='492' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>•  "Problème" offers 3 choices: obstruction, can't reach, other</text><text x='316' y='514' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>•  The same layout on phone and tablet; the tablet adds the map</text><text x='316' y='536' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>•  City crews tap; contractors use the printed sheet instead</text></svg>