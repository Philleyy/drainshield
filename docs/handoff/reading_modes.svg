<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 540' width='760' height='540' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Sensors read slowly in dry weather and every minute in a storm'><rect id='bg' x='0' y='0' width='760' height='540' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Sensors read slowly in dry weather and every minute in a storm</text><text x='24' y='52' font-size='11.5' fill='#57606a'>The first matching rule wins; a mode is held for a while after its last trigger.</text><rect x='268' y='76' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='280' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>DRY</text><text x='280' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reads every 30 min</text><text x='280' y='132' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>daily dry baseline</text><rect x='268' y='232' width='200' height='72' rx='8' fill='#bc4c00' fill-opacity='0.10' stroke='#bc4c00' stroke-width='2'/><text x='280' y='256' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>WATCH</text><text x='280' y='272' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reads every 5 min</text><text x='280' y='288' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>before the rain starts</text><rect x='268' y='388' width='200' height='72' rx='8' fill='#cf222e' fill-opacity='0.10' stroke='#cf222e' stroke-width='2'/><text x='280' y='412' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>STORM</text><text x='280' y='428' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reads every 60 s</text><text x='280' y='444' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>rise and drawdown curve</text><path d='M318 148 V230' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M318 304 V386' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M418 386 V306' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M418 230 V150' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='306' y='172' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='end'>≥ 10 mm forecast in the next 12 h</text><text x='306' y='188' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>or ≥ 2 mm starting within 3 h</text><text x='306' y='204' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>or light rain now (≥ 0.5 mm/h)</text><text x='306' y='328' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='end'>water rising ≥ 0.3 cm/min</text><text x='306' y='344' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>or &gt; 10 cm above the invert</text><text x='306' y='360' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='end'>or raining ≥ 2 mm/h</text><text x='430' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>30 min after the</text><text x='430' y='356' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>last trigger</text><text x='430' y='184' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>2 h after the</text><text x='430' y='200' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>last trigger</text><rect x='540' y='232' width='196' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='552' y='256' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Who decides</text><text x='552' y='272' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>server: picks the mode from</text><text x='552' y='288' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>the forecast, sends it back</text><text x='552' y='304' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor: jumps to STORM itself</text><text x='552' y='320' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>(a reply can be 30 min away)</text><text x='24' y='500' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Website seasons change the dry interval: 15 min in spring and fall, 30 in summer, 60 in winter</text><text x='24' y='516' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>(the firmware doesn't read that field yet). Code: polling_controller.py, web/server/season.py.</text></svg>