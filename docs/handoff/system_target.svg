<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 572' width='760' height='572' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Target: one sensor per zone feeds a map that plans half-day cleaning batches'><rect id='bg' x='0' y='0' width='760' height='572' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Target: one sensor per zone feeds a map that plans half-day cleaning batches</text><text x='24' y='52' font-size='11.5' fill='#57606a'>What the rebuilt product should do. The pitch demo, the judges' account and the sign-in page are gone.</text><rect x='200' y='72' width='360' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='212' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>One sensor pod per zone</text><text x='212' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>distance to the water + battery, in the zone's weakest basin</text><path d='M380 128 V160' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='200' y='162' width='360' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='212' y='186' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Upload to the website</text><text x='212' y='202' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Wi-Fi, LoRa or cellular (the link is still open)</text><path d='M380 218 V250' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='252' width='712' height='150' rx='10' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.25'/><text x='38' y='274' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'></text><rect x='40' y='284' width='160' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='52' y='308' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Zones</text><text x='52' y='324' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>grouped basins</text><rect x='216' y='284' width='160' height='56' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='228' y='308' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Engine</text><text x='228' y='324' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor → zone status</text><rect x='392' y='284' width='160' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='404' y='308' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain forecast</text><text x='404' y='324' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Env. Canada GEM</text><rect x='568' y='284' width='152' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='580' y='308' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Batches</text><text x='580' y='324' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>half-day routes</text><path d='M200 312 H214' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M392 312 H378' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M296 340 V360 H644 V342' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M644 360 V342' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='38' y='392' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='start'>Website, French first: the engine and thresholds stay the same as today</text><path d='M380 402 V426 M128 426 H632' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M128 426 V446' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M380 426 V446' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M632 426 V446' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='448' width='208' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='472' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Crew (field team)</text><text x='36' y='488' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>phone or tablet: today's batch,</text><text x='36' y='504' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>one big "done" per basin</text><rect x='276' y='448' width='208' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='288' y='472' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Foreman</text><text x='288' y='488' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>map + forecast on one screen,</text><text x='288' y='504' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>builds half-day batches</text><rect x='528' y='448' width='208' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='540' y='472' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Engineering / geomatics</text><text x='540' y='488' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>same map + an edit column:</text><text x='540' y='504' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basins, sensors, zones</text><text x='24' y='548' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>No sign-in for now: the first screen just asks which role you are. Contractors stay on paper; the foreman logs it.</text></svg>