<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='760' height='560' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Suggested shape: compute once in a worker, serve stored results'><rect id='bg' x='0' y='0' width='760' height='560' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Suggested shape: compute once in a worker, serve stored results</text><text x='24' y='52' font-size='11.5' fill='#57606a'>One way to remove today's shortcuts. Any language works; this is a suggestion, not a requirement.</text><rect x='24' y='72' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensors and bridges</text><text x='36' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>upload with a key</text><path d='M124 128 V170' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='172' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='196' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Ingest API</text><text x='36' y='212' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>check key, drop duplicates</text><text x='36' y='228' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reply with the reading mode</text><rect x='24' y='300' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='324' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Weather fetcher</text><text x='36' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>every hour, Open-Meteo GEM</text><rect x='280' y='172' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='292' y='196' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Readings</text><text x='292' y='212' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Postgres, indexed by time</text><rect x='280' y='300' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='292' y='324' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain hours</text><text x='292' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>observed + forecast</text><rect x='280' y='412' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='292' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basins + maintenance</text><text x='292' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>typed in by people</text><path d='M224 200 H278' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M224 328 H278' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='536' y='172' width='200' height='72' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='548' y='196' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Analysis worker</text><text x='548' y='212' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>on new data + every 15 min</text><text x='548' y='228' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>pure engine library</text><path d='M480 200 H534' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M480 328 H508 V224 M480 440 H508 V328' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M508 224 H534' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='536' y='300' width='200' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='548' y='324' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basin state</text><text x='548' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>status, why, prediction</text><path d='M636 244 V298' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='536' y='412' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='548' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>API + pages</text><text x='548' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>read the state, never</text><text x='548' y='468' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>compute on a page load</text><path d='M636 356 V410' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='24' y='520' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Engine = f(basin, readings, rain, log, now) → state: no globals, no CSV export, no lock.</text><text x='24' y='536' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Same thresholds and the same tests as today; only the plumbing changes.</text></svg>