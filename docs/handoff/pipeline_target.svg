<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 660' width='760' height='660' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='In the target, one sensor&apos;s status becomes its whole zone&apos;s status'><rect id='bg' x='0' y='0' width='760' height='660' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>In the target, one sensor's status becomes its whole zone's status</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Steps 1–6 are today's engine, unchanged. Steps 7–9 are new.</text><rect x='24' y='72' width='460' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>1–3  Reading → calibrated water level</text><text x='36' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>same rules as today (sensor basins only)</text><path d='M254 128 V142 M134 142 H374' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M134 142 V154' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 142 V154' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='156' width='220' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='180' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4a  Live state</text><text x='36' y='196' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>normal, rising, backing up</text><rect x='264' y='156' width='220' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='180' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4b  Storm analysis</text><text x='276' y='196' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>rise vs clean, drain time</text><rect x='264' y='240' width='220' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='264' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>5  Sensor basin status</text><text x='276' y='280' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>worst storm since cleaning</text><rect x='264' y='324' width='220' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='348' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>6  Pre-storm prediction</text><text x='276' y='364' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>forecast × learned rise</text><path d='M374 212 V238' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 296 V322' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='520' y='156' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='532' y='180' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain, past + forecast</text><text x='532' y='196' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Env. Canada GEM, hourly</text><rect x='520' y='240' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='532' y='264' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Maintenance log</text><text x='532' y='280' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>cleaned / no issue found</text><path d='M520 184 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M520 268 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M736 184 H750 V352 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='412' width='712' height='56' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>7  Zone status</text><text x='36' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>each zone takes its sensor's status; the zone's other basins inherit it (drawn hollow)</text><path d='M134 212 V410' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 380 V410' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='496' width='712' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='520' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>8  Map</text><text x='36' y='536' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>zones and basins coloured + shaped by status, forecast above</text><path d='M380 468 V494' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='580' width='712' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='604' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>9  Half-day batch → crew or contractor</text><text x='36' y='620' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>whole zones, urgent first, filled to ~4 h at ~5 min per basin; foreman logs what was done</text><path d='M380 552 V578' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/></svg>