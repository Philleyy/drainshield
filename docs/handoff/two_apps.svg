<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 460' width='760' height='460' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Both apps run the same engine files, so they always agree'><rect id='bg' x='0' y='0' width='760' height='460' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Both apps run the same engine files, so they always agree</text><text x='24' y='52' font-size='11.5' fill='#57606a'>The web app wraps the original analysis code instead of rewriting it.</text><rect x='180' y='72' width='400' height='112' rx='10' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.25'/><text x='194' y='94' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>Engine: the .py files in the repo root</text><text x='200' y='116' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>processing.py</text><text x='400' y='116' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>route_optimizer.py</text><text x='200' y='134' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>predictive.py</text><text x='400' y='134' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>weather.py</text><text x='200' y='152' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>data_store.py</text><text x='400' y='152' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='start'>demo_scenario.py</text><rect x='24' y='240' width='300' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='264' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Streamlit dashboard (app.py)</text><text x='36' y='280' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>original prototype, kept as a fallback</text><text x='36' y='296' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reads CSV files in data/</text><rect x='436' y='240' width='300' height='88' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='448' y='264' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Web server (web/server)</text><text x='448' y='280' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>state.py imports the engine as is</text><text x='448' y='296' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>fake Streamlit cache (shim/)</text><text x='448' y='312' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>copies the database to CSV first</text><path d='M174 240 V186' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M586 240 V186' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='180' y='220' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>imports</text><text x='592' y='220' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>imports</text><rect x='436' y='380' width='140' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='448' y='404' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>PostgreSQL</text><text x='448' y='420' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>SQLite locally</text><rect x='596' y='380' width='140' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='608' y='404' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>React site</text><text x='608' y='420' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>web/frontend</text><path d='M506 328 V378' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M666 328 V378' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='24' y='404' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Shortcut: the engine keeps its state in module globals,</text><text x='24' y='420' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>so the web server runs one request at a time (a lock).</text></svg>