<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 548' width='760' height='548' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Colour always means urgency, and a shape repeats it for colour-blind readers'><rect id='bg' x='0' y='0' width='760' height='548' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Colour always means urgency, and a shape repeats it for colour-blind readers</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Zones are dashed outlines with a letter. A zone is tinted only when its sensor raises an alert.</text><text x='24' y='84' font-size='11' font-weight='700' fill='#57606a' text-anchor='start'>BASIN STATUS</text><path d='M36 99.35 L48.1 121.35 L23.9 121.35 Z' fill='#cf222e' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round'/><rect x='34.8' y='107.05' width='2.4' height='7.699999999999999' fill='#ffffff'/><circle cx='36' cy='117.5' r='1.4' fill='#ffffff'/><path d='M64 103.95 L71.7 117.95 L56.3 117.95 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><text x='84' y='116.5' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Urgent</text><text x='148' y='116.5' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>· flooding, or clean before the storm</text><path d='M396 99.9 L408.1 112 L396 124.1 L383.9 112 Z' fill='#bc4c00' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round'/><circle cx='396' cy='112' r='3.08' fill='#ffffff'/><path d='M424 104.3 L431.7 112 L424 119.7 L416.3 112 Z' fill='#ffffff' stroke='#bc4c00' stroke-width='2' stroke-linejoin='round'/><text x='444' y='116.5' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Inspect</text><text x='510' y='116.5' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>· draining slowly</text><circle cx='36' cy='148' r='11' fill='#1a7f37' stroke='#ffffff' stroke-width='1.5'/><path d='M31.05 148 l3.3 3.52 l6.050000000000001 -6.82' fill='none' stroke='#ffffff' stroke-width='2'/><circle cx='64' cy='148' r='7' fill='#ffffff' stroke='#1a7f37' stroke-width='2'/><text x='84' y='152.5' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Normal</text><text x='154' y='152.5' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>· draining well</text><rect x='386.1' y='138.1' width='19.8' height='19.8' rx='2' fill='#6e7781' stroke='#ffffff' stroke-width='1.5'/><text x='396' y='152.62' font-size='13.2' font-weight='700' fill='#ffffff' text-anchor='middle'>?</text><text x='416' y='152.5' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor offline</text><text x='528' y='152.5' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>· a device problem, not the basin</text><text x='24' y='192' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Filled = the basin has a sensor.  Outline only = no sensor: it shows its zone's status, inferred.</text><text x='24' y='232' font-size='11' font-weight='700' fill='#57606a' text-anchor='start'>ZONES</text><path d='M40 272 L300 250 L330 366 L210 416 L56 388 Z' fill='none' stroke='#1f2328' stroke-width='1.25' stroke-dasharray='6 4'/><rect x='52' y='256' width='66' height='24' rx='12' fill='#ffffff' stroke='#1f2328' stroke-width='1.25'/><text x='65' y='272.5' font-size='12.5' font-weight='700' fill='#1f2328' text-anchor='middle'>A</text><path d='M78 274 C78 265 83 261 91 261 C91 269 86 274 78 274 Z' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M78 274 L87 265' stroke='#1f2328' stroke-width='1.2'/><circle cx='104' cy='268' r='7' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M104 264 V268 L107 270' fill='none' stroke='#1f2328' stroke-width='1.4'/><circle cx='110' cy='326' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='150' cy='354' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='196' cy='336' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='240' cy='372' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='276' cy='316' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='120' cy='386' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='230' cy='288' r='4' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><circle cx='186' cy='304' r='10' fill='#1a7f37' stroke='#ffffff' stroke-width='1.5'/><path d='M181.5 304 l3.0 3.2 l5.5 -6.2' fill='none' stroke='#ffffff' stroke-width='2'/><text x='40' y='440' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Zone A is fine: its sensor is green,</text><text x='40' y='456' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>the other basins stay plain grey dots.</text><path d='M396 266 L690 248 L720 376 L560 420 L410 382 Z' fill='url(#hatch-urgent)'/><path d='M396 266 L690 248 L720 376 L560 420 L410 382 Z' fill='#cf222e' fill-opacity='0.06'/><path d='M396 266 L690 248 L720 376 L560 420 L410 382 Z' fill='none' stroke='#1f2328' stroke-width='1.25' stroke-dasharray='6 4'/><rect x='408' y='252' width='66' height='24' rx='12' fill='#ffffff' stroke='#1f2328' stroke-width='1.25'/><text x='421' y='268.5' font-size='12.5' font-weight='700' fill='#1f2328' text-anchor='middle'>B</text><path d='M433 259 Q440 274 447 259' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M440 257 V264 M437 261 L440 264 L443 261' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M452 262 q4 -4 8 0 t8 0 M452 268 q4 -4 8 0 t8 0' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M470 329.1 L476.6 341.1 L463.4 341.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M512 359.1 L518.6 371.1 L505.4 371.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M560 319.1 L566.6 331.1 L553.4 331.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M612 365.1 L618.6 377.1 L605.4 377.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M650 305.1 L656.6 317.1 L643.4 317.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M480 381.1 L486.6 393.1 L473.4 393.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M668 349.1 L674.6 361.1 L661.4 361.1 Z' fill='#ffffff' stroke='#cf222e' stroke-width='2' stroke-linejoin='round'/><path d='M590 281.35 L602.1 303.35 L577.9 303.35 Z' fill='#cf222e' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round'/><rect x='588.8' y='289.05' width='2.4' height='7.699999999999999' fill='#ffffff'/><circle cx='590' cy='299.5' r='1.4' fill='#ffffff'/><text x='396' y='440' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Zone B's sensor says urgent: the zone gets stripes</text><text x='396' y='456' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>and its basins show hollow triangles.</text><text x='24' y='496' font-size='11' font-weight='700' fill='#57606a' text-anchor='start'>WHY A ZONE IS RISKY (symbols on its label, never a colour)</text><path d='M26 524 C26 515 31 511 39 511 C39 519 34 524 26 524 Z' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M26 524 L35 515' stroke='#1f2328' stroke-width='1.2'/><text x='46' y='523' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>trees, fall leaves</text><path d='M169 513 Q176 528 183 513' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M176 511 V518 M173 515 L176 518 L179 515' fill='none' stroke='#1f2328' stroke-width='1.4'/><text x='190' y='523' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>low point</text><path d='M270 516 q4 -4 8 0 t8 0 M270 522 q4 -4 8 0 t8 0' fill='none' stroke='#1f2328' stroke-width='1.4'/><text x='292' y='523' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>near the outfall / river</text><circle cx='456' cy='518' r='7' fill='none' stroke='#1f2328' stroke-width='1.4'/><path d='M456 514 V518 L459 520' fill='none' stroke='#1f2328' stroke-width='1.4'/><text x='470' y='523' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>past problems</text><path d='M611 512 L617 518 M625 512 L619 518 M618 511 V517' stroke='#1f2328' stroke-width='1.4'/><rect x='614' y='519' width='8' height='6' rx='1' fill='none' stroke='#1f2328' stroke-width='1.4'/><text x='632' y='523' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>large area drains here</text></svg>