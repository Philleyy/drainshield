<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 636' width='760' height='636' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Zones and batches are the two new things to store'><rect id='bg' x='0' y='0' width='760' height='636' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Zones and batches are the two new things to store</text><text x='24' y='52' font-size='11.5' fill='#57606a'>No user accounts: the role is chosen on the device. Upload keys remain, so only real sensors can send data.</text><rect x='24' y='72' width='340' height='88' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Zone</text><text x='36' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>letter, name, outline on the map</text><text x='36' y='128' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>risk factors (leaves, low point, ...)</text><text x='36' y='144' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sentinel basin, confidence</text><rect x='420' y='72' width='316' height='88' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basin (the asset)</text><text x='432' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basin id, city id, address, GPS</text><text x='432' y='128' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>as-built: diameter, invert, sump, trap</text><text x='432' y='144' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>zone it belongs to</text><path d='M364 116 H420' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='392' y='108' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='middle'>1 · n</text><rect x='420' y='200' width='316' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='224' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor (the device)</text><text x='432' y='240' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor id, basin it sits in (the sentinel)</text><text x='432' y='256' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reading mode, learned invert distance</text><path d='M578 160 V200' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='586' y='184' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · 0..1</text><rect x='420' y='316' width='316' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='340' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Reading</text><text x='432' y='356' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>time, distance, battery, flags</text><path d='M578 272 V316' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='586' y='298' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · n</text><rect x='24' y='200' width='340' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='224' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Batch (a half-day of work)</text><text x='36' y='240' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>date, crew or contractor, shift length</text><text x='36' y='256' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>status: planned, sent, logged</text><rect x='24' y='316' width='340' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='340' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Batch stop</text><text x='36' y='356' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>order, basin, done or not, what was found</text><path d='M194 272 V316' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='202' y='298' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · n</text><path d='M364 344 H392 V144 H420' fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='386' y='252' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='end'>basin</text><rect x='24' y='412' width='340' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Maintenance entry</text><text x='36' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>time, basin, action, sediment found</text><text x='36' y='468' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>logged by which role</text><rect x='420' y='412' width='316' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain hour + Upload key</text><text x='432' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>observed / forecast mm; key per uploader</text><rect x='24' y='508' width='712' height='104' rx='10' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.25'/><text x='38' y='530' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>Derived by the engine (recomputed, can be cached)</text><rect x='40' y='540' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='52' y='564' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Storm event</text><text x='52' y='580' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>rise, drain time, diagnosis</text><rect x='272' y='540' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='284' y='564' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basin state</text><text x='284' y='580' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor basins only</text><rect x='504' y='540' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='516' y='564' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Zone state</text><text x='516' y='580' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>= its sentinel's state</text></svg>