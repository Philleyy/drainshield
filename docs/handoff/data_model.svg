<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 648' width='760' height='648' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Keep the basin (asset) apart from the sensor (device), so a pod can move'><rect id='bg' x='0' y='0' width='760' height='648' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Keep the basin (asset) apart from the sensor (device), so a pod can move</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Today readings and the sensors table are keyed by basin_id, so a pod can't move. Dashed = computed.</text><rect x='24' y='72' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>User</text><text x='36' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>email, name, role</text><text x='36' y='128' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>password hash (argon2id)</text><rect x='292' y='80' width='172' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='304' y='104' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Session</text><text x='304' y='120' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>token hash, expiry</text><rect x='492' y='72' width='244' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='504' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Upload key</text><text x='504' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>id, secret hash, label</text><text x='504' y='128' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>revoked or not</text><path d='M244 108 H292' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='268' y='100' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='middle'>1 · n</text><rect x='24' y='184' width='340' height='104' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='208' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basin (the asset)</text><text x='36' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basin id, city id, address, GPS</text><text x='36' y='240' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>diameter, invert depth (or learned)</text><text x='36' y='256' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>outlet pipe, sump depth, trap or not</text><text x='36' y='272' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor depth, catchment area</text><rect x='420' y='184' width='316' height='104' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='208' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor (the device)</text><text x='432' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor id, basin it sits in</text><text x='432' y='240' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>reading mode: DRY / WATCH / STORM</text><text x='432' y='256' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>learned distance to the invert</text><text x='432' y='272' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>installed at</text><path d='M364 236 H420' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='392' y='228' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='middle'>1 · 0..1</text><path d='M614 144 V184' fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='622' y='168' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>authenticates uploads</text><rect x='24' y='328' width='200' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='352' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Maintenance entry</text><text x='36' y='368' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>time, action, sediment</text><text x='36' y='384' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>note, who</text><rect x='248' y='328' width='150' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='260' y='352' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Run stop</text><text x='260' y='368' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>order, arrival</text><rect x='420' y='328' width='316' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='352' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Reading</text><text x='432' y='368' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>time, distance, battery</text><text x='432' y='384' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>flags (iced, no echo), raw + filtered</text><path d='M124 288 V328 M323 288 V328 M578 288 V328' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='132' y='314' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · n</text><text x='331' y='314' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · n</text><text x='586' y='314' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>1 · n</text><rect x='248' y='424' width='150' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='260' y='448' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Pre-storm run</text><text x='260' y='464' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>leaves at, sent by</text><path d='M323 384 V424' fill='none' stroke='#8c959f' stroke-width='1.25'/><rect x='420' y='424' width='316' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='432' y='448' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain hour</text><text x='432' y='464' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>hour, mm, observed or forecast</text><rect x='24' y='512' width='712' height='112' rx='10' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.25'/><text x='38' y='534' font-size='12' font-weight='600' fill='#57606a' text-anchor='start'>Derived by the engine: recomputed from the rows above, can be cached</text><rect x='40' y='548' width='330' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='52' y='572' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Storm event</text><text x='52' y='588' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>start, end, mm, peak, rise, drain time, diagnosis</text><rect x='390' y='548' width='330' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='402' y='572' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Basin state</text><text x='402' y='588' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>live state, status, reasons, prediction, colour</text><path d='M124 400 V510' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M578 480 V510' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/></svg>