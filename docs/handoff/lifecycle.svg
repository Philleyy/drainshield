<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 440' width='760' height='440' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='An issue closes itself: the sensor sees the cleaning and checks the next rain'><rect id='bg' x='0' y='0' width='760' height='440' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>An issue closes itself: the sensor sees the cleaning and checks the next rain</text><text x='24' y='52' font-size='11.5' fill='#57606a'>No extra work for the City. Code: maintenance.py, web/server/state.py (cleaning_check).</text><text x='24' y='88' font-size='11.5' font-weight='600' fill='#bc4c00' text-anchor='start'>Detected (unverified)</text><text x='516' y='88' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='start'>Verified / crew dispatched</text><text x='270' y='220' font-size='11.5' font-weight='600' fill='#1a7f37' text-anchor='start'>Resolved</text><rect x='24' y='96' width='210' height='72' rx='8' fill='#bc4c00' fill-opacity='0.10' stroke='#bc4c00' stroke-width='2'/><text x='36' y='120' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Slow storm seen</text><text x='36' y='136' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>the sensor flags the basin</text><text x='36' y='152' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>on the map: orange</text><rect x='270' y='96' width='210' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='282' y='120' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Pre-storm run</text><text x='282' y='136' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>heavy rain forecast: route</text><text x='282' y='152' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>proposed, urgent first</text><rect x='516' y='96' width='220' height='72' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='528' y='120' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Send to crew</text><text x='528' y='136' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>logs "Crew dispatched"</text><text x='528' y='152' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>per stop, on the tablet</text><path d='M234 132 H268' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M480 132 H514' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='516' y='228' width='220' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='528' y='252' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Truck empties the sump</text><text x='528' y='268' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>water ≥ 10 cm below invert</text><path d='M626 168 V226' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='270' y='228' width='210' height='56' rx='8' fill='#1a7f37' fill-opacity='0.10' stroke='#1a7f37' stroke-width='2'/><text x='282' y='252' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Cleaning logged</text><text x='282' y='268' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>by the server, nobody taps</text><path d='M516 256 H482' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><polygon points='24,264 129,222 234,264 129,306' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='129' y='260' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='middle'>Next rain drains</text><text x='129' y='276' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='middle'>normally?</text><path d='M270 264 H236' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M129 306 V342' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='137' y='330' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>yes</text><path d='M60 250 V170' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='68' y='214' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no: still slow</text><rect x='24' y='344' width='210' height='72' rx='8' fill='#1a7f37' fill-opacity='0.10' stroke='#1a7f37' stroke-width='2'/><text x='36' y='368' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Confirmed</text><text x='36' y='384' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>proof for the City, with</text><text x='36' y='400' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>nothing for the crew to fill</text><text x='270' y='330' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>A crew can also log "No issue found" or "Cleaned" by hand:</text><text x='270' y='346' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>either one closes the issue and restarts the storm count.</text></svg>