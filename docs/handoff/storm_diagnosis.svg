<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 396' width='760' height='396' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Each storm is judged against the same basin when it was clean'><rect id='bg' x='0' y='0' width='760' height='396' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Each storm is judged against the same basin when it was clean</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Dashed = how this basin rose when clean (learned from its first 3 storms). Solid = this storm.</text><rect x='28' y='72' width='224' height='300' rx='8' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='42' y='96' font-size='13' font-weight='600' fill='#1a7f37' text-anchor='start'>Normal</text><path d='M44 112 H236' fill='none' stroke='#d0d7de' stroke-width='1.25'/><rect x='72' y='112' width='10' height='10' fill='#0969da' fill-opacity='0.45'/><rect x='84' y='112' width='10' height='26' fill='#0969da' fill-opacity='0.45'/><rect x='96' y='112' width='10' height='18' fill='#0969da' fill-opacity='0.45'/><rect x='108' y='112' width='10' height='8' fill='#0969da' fill-opacity='0.45'/><text x='44' y='128' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>rain</text><path d='M44 280 H236' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='236' y='296' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='end'>outlet invert</text><path d='M44 280 H72 C88 280 98 235 114 235 C128 235 132 280 152 280 H236' fill='none' stroke='#8c959f' stroke-width='1.5' stroke-dasharray='5 4'/><path d='M44 280 H72 C88 280 100 228 118 228 C132 228 134 280 150 280 H236' fill='none' stroke='#1a7f37' stroke-width='2.5'/><text x='42' y='324' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>rose about as much as when clean</text><text x='42' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>drained in under 30 min</text><rect x='268' y='72' width='224' height='300' rx='8' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='282' y='96' font-size='13' font-weight='600' fill='#cf222e' text-anchor='start'>Outlet / trap restricted</text><path d='M284 112 H476' fill='none' stroke='#d0d7de' stroke-width='1.25'/><rect x='312' y='112' width='10' height='10' fill='#0969da' fill-opacity='0.45'/><rect x='324' y='112' width='10' height='26' fill='#0969da' fill-opacity='0.45'/><rect x='336' y='112' width='10' height='18' fill='#0969da' fill-opacity='0.45'/><rect x='348' y='112' width='10' height='8' fill='#0969da' fill-opacity='0.45'/><text x='284' y='128' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>rain</text><path d='M284 280 H476' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='476' y='296' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='end'>outlet invert</text><path d='M284 280 H312 C328 280 338 235 354 235 C368 235 372 280 392 280 H476' fill='none' stroke='#8c959f' stroke-width='1.5' stroke-dasharray='5 4'/><path d='M284 280 H312 C328 280 340 160 358 160 C398 160 438 255 476 262' fill='none' stroke='#cf222e' stroke-width='2.5'/><text x='282' y='324' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>rose more than 2× the clean rise,</text><text x='282' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>or drained slowly (&gt; 30 min)</text><text x='282' y='356' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>capacity left ≈ 1 ÷ rise ratio</text><rect x='508' y='72' width='224' height='300' rx='8' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='522' y='96' font-size='13' font-weight='600' fill='#bc4c00' text-anchor='start'>Grate probably covered</text><path d='M524 112 H716' fill='none' stroke='#d0d7de' stroke-width='1.25'/><rect x='552' y='112' width='10' height='14' fill='#0969da' fill-opacity='0.45'/><rect x='564' y='112' width='10' height='30' fill='#0969da' fill-opacity='0.45'/><rect x='576' y='112' width='10' height='30' fill='#0969da' fill-opacity='0.45'/><rect x='588' y='112' width='10' height='16' fill='#0969da' fill-opacity='0.45'/><text x='524' y='128' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>rain</text><path d='M524 280 H716' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='716' y='296' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='end'>outlet invert</text><path d='M524 280 H552 C568 280 578 235 594 235 C608 235 612 280 632 280 H716' fill='none' stroke='#8c959f' stroke-width='1.5' stroke-dasharray='5 4'/><path d='M524 280 H552 C568 280 580 268 598 268 C612 268 614 280 630 280 H716' fill='none' stroke='#bc4c00' stroke-width='2.5'/><text x='522' y='324' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>big rain, but rose &lt; 40% of the</text><text x='522' y='340' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>clean rise: water stays on the</text><text x='522' y='356' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>street (leaves on the grate)</text></svg>