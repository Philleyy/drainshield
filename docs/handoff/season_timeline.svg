<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 376' width='760' height='376' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Sensors sleep through the winter and wake up with the snowmelt'><rect id='bg' x='0' y='0' width='760' height='376' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Sensors sleep through the winter and wake up with the snowmelt</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Risk shading is qualitative. The forecast (Env. Canada GEM via Open-Meteo) gives daily highs, rain and snowfall.</text><text x='145.66666666666666' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>J</text><path d='M120.0 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='197.0' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>F</text><path d='M171.3 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='248.33333333333334' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>M</text><path d='M222.7 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='299.6666666666667' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>A</text><path d='M274.0 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='351.0' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>M</text><path d='M325.3 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='402.33333333333337' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>J</text><path d='M376.7 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='453.6666666666667' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>J</text><path d='M428.0 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='505.0' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>A</text><path d='M479.3 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='556.3333333333334' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>S</text><path d='M530.7 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='607.6666666666667' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>O</text><path d='M582.0 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='659.0' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>N</text><path d='M633.3 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='710.3333333333334' y='88' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='middle'>D</text><path d='M684.7 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><path d='M736.0 96 V312' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='24' y='124' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Clog / flood risk</text><rect x='120.0' y='106' width='128.3' height='28' fill='#0969da' fill-opacity='0.06'/><text x='184.16666666666669' y='124' font-size='11' font-weight='400' fill='#1f2328' text-anchor='middle'>≈ 0</text><rect x='248.3' y='106' width='128.3' height='28' fill='#0969da' fill-opacity='0.45'/><text x='312.5' y='124' font-size='11' font-weight='600' fill='#1f2328' text-anchor='middle'>snowmelt + spring rain</text><rect x='376.7' y='106' width='179.7' height='28' fill='#0969da' fill-opacity='0.25'/><text x='466.5' y='124' font-size='11' font-weight='400' fill='#1f2328' text-anchor='middle'>summer storms</text><rect x='556.3' y='106' width='128.3' height='28' fill='#0969da' fill-opacity='0.45'/><text x='620.5' y='124' font-size='11' font-weight='600' fill='#1f2328' text-anchor='middle'>fall leaves</text><rect x='684.7' y='106' width='51.3' height='28' fill='#0969da' fill-opacity='0.06'/><text x='24' y='176' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor</text><rect x='120.0' y='158' width='112.9' height='28' rx='4' fill='#6e7781' fill-opacity='0.25'/><rect x='684.7' y='158' width='51.3' height='28' rx='4' fill='#6e7781' fill-opacity='0.25'/><text x='176.46666666666667' y='176' font-size='11' font-weight='600' fill='#1f2328' text-anchor='middle'>asleep</text><rect x='232.9' y='158' width='451.7' height='28' rx='4' fill='#0969da' fill-opacity='0.75'/><text x='458.80000000000007' y='176' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>awake: dry readings every 15–30 min, every 5 min / 60 s around storms</text><rect x='197.0' y='196' width='87.3' height='8' rx='4' fill='#bc4c00' fill-opacity='0.5'/><path d='M232.9 232 V206' fill='none' stroke='#bc4c00' stroke-width='1.25' marker-end='url(#arrow)'/><text x='197.0' y='250' font-size='11.5' font-weight='700' fill='#1f2328' text-anchor='start'>Wake (sometime mid-Feb to March):</text><text x='197.0' y='266' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>several days above 0 °C forecast, or rain on snow;</text><text x='197.0' y='282' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>fallback date if the forecast is unavailable</text><path d='M684.7 300 V188' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arrow)'/><text x='678.6666666666667' y='300' font-size='11.5' font-weight='700' fill='#1f2328' text-anchor='end'>Sleep (≈ Dec 1): freeze-up, risk ≈ 0,</text><text x='678.6666666666667' y='316' font-size='11' font-weight='400' fill='#57606a' text-anchor='end'>cleaning no longer realistic</text><text x='24' y='352' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Asleep = one check-in a day. No field visit: that check-in's reply tells the sensor to wake up. Battery: 3 years at first, 5–10 later.</text></svg>