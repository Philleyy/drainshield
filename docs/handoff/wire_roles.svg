<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 616' width='760' height='616' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='The first screen asks one question: who are you?'><rect id='bg' x='0' y='0' width='760' height='616' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>The first screen asks one question: who are you?</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Replaces the sign-in page. French by default; English is one tap away.</text><rect x='24' y='72' width='280' height='520' rx='26' fill='#ffffff' stroke='#1f2328' stroke-width='2'/><rect x='134.0' y='82' width='60' height='6' rx='3' fill='#d0d7de'/><text x='164' y='132' font-size='18' font-weight='700' fill='#1f2328' text-anchor='middle'>DrainShield</text><text x='164' y='152' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>Travaux publics</text><text x='164' y='200' font-size='20' font-weight='700' fill='#1f2328' text-anchor='middle'>Qui êtes-vous ?</text><rect x='44' y='226' width='240' height='80' rx='14' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='64' y='260' font-size='15' font-weight='700' fill='#1f2328' text-anchor='start'>Équipe terrain</text><text x='64' y='282' font-size='12' font-weight='400' fill='#57606a' text-anchor='start'>le lot du jour, sur tablette</text><text x='270' y='272' font-size='22' font-weight='400' fill='#57606a' text-anchor='end'>›</text><rect x='44' y='322' width='240' height='80' rx='14' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='64' y='356' font-size='15' font-weight='700' fill='#1f2328' text-anchor='start'>Contremaître</text><text x='64' y='378' font-size='12' font-weight='400' fill='#57606a' text-anchor='start'>carte, météo, lots de travail</text><text x='270' y='368' font-size='22' font-weight='400' fill='#57606a' text-anchor='end'>›</text><rect x='44' y='418' width='240' height='80' rx='14' fill='#ffffff' stroke='#1f2328' stroke-width='1.5'/><text x='64' y='452' font-size='15' font-weight='700' fill='#1f2328' text-anchor='start'>Ingénierie / géomatique</text><text x='64' y='474' font-size='12' font-weight='400' fill='#57606a' text-anchor='start'>tout voir, ajouter, modifier</text><text x='270' y='464' font-size='22' font-weight='400' fill='#57606a' text-anchor='end'>›</text><text x='164' y='546' font-size='11' font-weight='400' fill='#57606a' text-anchor='middle'>Retenu sur cet appareil</text><text x='164' y='568' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='middle'>English</text><path d='M286 266 H350' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='352' y='230' width='384' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='364' y='254' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Crew screen</text><text x='364' y='270' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>phone or tablet: today's batch,</text><text x='364' y='286' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>one big button per basin</text><path d='M286 362 H350' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='352' y='326' width='384' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='364' y='350' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Map page</text><text x='364' y='366' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>map + forecast, what to do,</text><text x='364' y='382' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>build a half-day batch</text><path d='M286 458 H350' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='352' y='422' width='384' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='364' y='446' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Map page + edit column</text><text x='364' y='462' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basins, sensors, zones,</text><text x='364' y='478' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor upload keys</text><text x='352' y='532' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>No password for now: anyone with the link can pick any role.</text><text x='352' y='548' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Fine for a prototype; add a check before real city data goes in.</text></svg>