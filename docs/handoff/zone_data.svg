<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 516' width='760' height='516' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Zones can be scored from data the city already has, with no field work'><rect id='bg' x='0' y='0' width='760' height='516' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Zones can be scored from data the city already has, with no field work</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Start with column 1 (free, works for any Québec city); add column 2 when a city shares its files; column 3 builds itself.</text><rect x='24' y='72' width='224' height='212' rx='8' fill='#0969da' fill-opacity='0.06' stroke='#0969da' stroke-width='2'/><text x='36' y='96' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>1  Public data</text><text x='36' y='113' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no effort from the city</text><text x='36' y='138' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• lidar: low points, slope,</text><text x='36' y='156' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>area draining to each basin</text><text x='36' y='174' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• lidar: tree canopy height</text><text x='36' y='192' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• rivers + flood events by year</text><text x='36' y='210' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• OpenStreetMap: parking lots,</text><text x='36' y='228' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>unpaved lanes, land use</text><text x='36' y='246' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• 311 requests (Montréal only)</text><rect x='268' y='72' width='224' height='212' rx='8' fill='none' fill-opacity='0.06' stroke='#8c959f' stroke-width='1.25'/><text x='280' y='96' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>2  City office records</text><text x='280' y='113' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>already on file, no field work</text><text x='280' y='138' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• basin inventory (age, type)</text><text x='280' y='156' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• sewer network: branches,</text><text x='280' y='174' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>outfalls, pipe slopes</text><text x='280' y='192' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• cleaning contracts + invoices</text><text x='280' y='210' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• complaints / request log</text><text x='280' y='228' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• snow dumps, sand routes</text><text x='280' y='246' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• construction permits</text><rect x='512' y='72' width='224' height='212' rx='8' fill='none' fill-opacity='0.06' stroke='#8c959f' stroke-width='1.25'/><text x='524' y='96' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>3  Learned by DrainShield</text><text x='524' y='113' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>automatic, from the pilot on</text><text x='524' y='138' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• each sensor's drain times</text><text x='524' y='156' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>and recovery index</text><text x='524' y='174' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• zones whose sensors disagree</text><text x='524' y='192' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>→ split</text><text x='524' y='210' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>• optional: what cleaners</text><text x='524' y='228' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>wrote on their sheet</text><path d='M136 284 V304 M624 284 V304 M136 304 H624' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M380 284 V326' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='190' y='328' width='380' height='56' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='380.0' y='352' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>Basin risk profile</text><text x='380.0' y='368' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>each factor scaled 0–1, weights start equal</text><path d='M380 384 V410' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='190' y='412' width='380' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='380.0' y='436' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>Zones + where each sensor goes</text><text x='380.0' y='452' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>foreman glances over them; no field survey</text><text x='24' y='494' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>The pilot checks the weights: Samuel's "often blocks" zone must score higher than his "rarely blocks" zone.</text></svg>