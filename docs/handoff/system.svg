<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 724' width='760' height='724' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Every reading takes one path: pod → website → a decision for a person'><rect id='bg' x='0' y='0' width='760' height='724' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Every reading takes one path: pod → website → a decision for a person</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Dashed = planned. Today the reading mode is picked on the laptop (polling_controller.py) and sent back in the LoRa ACK.</text><rect x='240' y='72' width='280' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='252' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor pod in the catch basin</text><text x='252' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>measures distance to the water + battery</text><path d='M380 128 V148 M116 148 H644' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M116 148 V166' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M292 148 V166' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M468 148 V166' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M644 148 V166' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='34' y='168' width='164' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='46' y='192' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>USB cable</text><text x='46' y='208' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>bench tests</text><text x='46' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sensor_bridge.py</text><rect x='210' y='168' width='164' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='222' y='192' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>LoRa radio</text><text x='222' y='208' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>nodes → USB receiver</text><text x='222' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>lora_bridge.py</text><rect x='386' y='168' width='164' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='398' y='192' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Wi-Fi</text><text x='398' y='208' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>ESP8266 board</text><text x='398' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>posts straight to site</text><rect x='562' y='168' width='164' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='5 4'/><text x='574' y='192' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Cellular (LTE)</text><text x='574' y='208' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>final product</text><text x='574' y='224' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>not solved yet</text><path d='M116 240 V278' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M292 240 V278' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='34' y='280' width='340' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='46' y='304' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Bridge script on a laptop</text><text x='46' y='320' font-size='11.5' 