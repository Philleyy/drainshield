<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' width='760' height='400' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='The sensor raises the issue; the batch and the next rain close it'><rect id='bg' x='0' y='0' width='760' height='400' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>The sensor raises the issue; the batch and the next rain close it</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Paper stays paper for contractors: the foreman enters the result afterwards in a few taps.</text><rect x='24' y='76' width='210' height='72' rx='8' fill='#bc4c00' fill-opacity='0.10' stroke='#bc4c00' stroke-width='2'/><text x='36' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Sensor flags the zone</text><text x='36' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>slow storm, or heavy rain</text><text x='36' y='132' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>forecast on a weak zone</text><rect x='270' y='76' width='210' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='282' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Foreman builds a batch</text><text x='282' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>whole zones, ≈ half a day</text><rect x='516' y='76' width='220' height='72' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='528' y='100' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Crew or contractor</text><text x='528' y='116' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>tablet, or the printed</text><text x='528' y='132' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sheet (Sani-Vac: paper)</text><path d='M234 112 H268' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M480 112 H514' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='516' y='208' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='528' y='232' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Foreman logs the result</text><text x='528' y='248' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>"all cleaned", untick the</text><text x='528' y='264' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basins that weren't done</text><path d='M626 148 V206' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='270' y='208' width='210' height='72' rx='8' fill='#1a7f37' fill-opacity='0.10' stroke='#1a7f37' stroke-width='2'/><text x='282' y='232' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Zone reset</text><text x='282' y='248' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>the sensor also sees its own</text><text x='282' y='264' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sump emptied: double check</text><path d='M516 244 H482' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><polygon points='24,244 129,202 234,244 129,286' fill='none' stroke='#8c959f' stroke-width='1.25'/><text x='129' y='240' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='middle'>Next rain drains</text><text x='129' y='256' font-size='12.5' font-weight='600' fill='#1f2328' text-anchor='middle'>normally?</text><path d='M270 244 H236' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M129 286 V322' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='137' y='310' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>yes</text><path d='M60 230 V150' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='68' y='194' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>no: still slow</text><rect x='24' y='324' width='210' height='56' rx='8' fill='#1a7f37' fill-opacity='0.10' stroke='#1a7f37' stroke-width='2'/><text x='36' y='348' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Confirmed</text><text x='36' y='364' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>proof for the city</text><text x='270' y='320' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>What the cleaners found in each basin (empty, half, full) is the</text><text x='270' y='336' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>data that tells us, over time, whether the zone was drawn right.</text></svg>