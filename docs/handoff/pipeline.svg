<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 820' width='760' height='820' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='From a distance reading to "clean this basin before tonight&apos;s storm"'><rect id='bg' x='0' y='0' width='760' height='820' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>From a distance reading to "clean this basin before tonight's storm"</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Steps 2–6 live in processing.py and predictive.py; step 7 in data_store.triage; step 8 in route_optimizer.py.</text><rect x='24' y='72' width='460' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='96' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>1  Readings</text><text x='36' y='112' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>basin, time, distance to the water, battery</text><rect x='24' y='156' width='460' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='180' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>2  Calibrate</text><text x='36' y='196' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>learn where the outlet invert is from a dry, steady day</text><rect x='24' y='240' width='460' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='264' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>3  Water level</text><text x='36' y='280' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>cm above the invert, spikes removed (3-point median)</text><path d='M254 128 V154' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M254 212 V238' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M254 296 V310 M134 310 H374' fill='none' stroke='#8c959f' stroke-width='1.25'/><path d='M134 310 V322' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 310 V322' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='324' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='348' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4a  Live state</text><text x='36' y='364' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>what the water does now:</text><text x='36' y='380' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>normal, rising, backing up</text><rect x='264' y='324' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='348' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>4b  Storm analysis</text><text x='276' y='364' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>rise vs clean, drain time,</text><text x='276' y='380' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>capacity left</text><rect x='264' y='424' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='448' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>5  Maintenance status</text><text x='276' y='464' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>worst storm since cleaning</text><text x='276' y='480' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>+ sediment estimate</text><rect x='264' y='524' width='220' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='276' y='548' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>6  Pre-storm prediction</text><text x='276' y='564' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>forecast intensity × rise</text><text x='276' y='580' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>learned from last storm</text><path d='M374 396 V422' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 496 V522' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='520' y='324' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='532' y='348' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain, past 7 days</text><text x='532' y='364' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>hourly, Env. Canada GEM</text><rect x='520' y='424' width='216' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='532' y='448' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Maintenance log</text><text x='532' y='464' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>cleaned / no issue found</text><text x='532' y='480' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>restarts the count</text><rect x='520' y='524' width='216' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='532' y='548' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>Rain forecast</text><text x='532' y='564' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>next 24 h, same model</text><path d='M520 352 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M520 452 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M520 552 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='24' y='624' width='460' height='56' rx='8' fill='#0969da' fill-opacity='0.10' stroke='#0969da' stroke-width='2'/><text x='36' y='648' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>7  Triage: map colour + dispatch list</text><text x='36' y='664' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Offline · Urgent · Inspect before storm · Inspect · Normal</text><path d='M134 396 V622' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M374 596 V622' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M628 580 V660 H486' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/><text x='636' y='616' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>heavy rain soon?</text><rect x='24' y='724' width='460' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8c959f' stroke-width='1.25'/><text x='36' y='748' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>8  Pre-storm run → crew tablet</text><text x='36' y='764' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>truck route, urgent stops first; the sensor confirms each cleaning</text><path d='M254 696 V722' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arrow)'/></svg>