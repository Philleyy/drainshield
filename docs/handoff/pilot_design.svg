<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 412' width='760' height='412' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Pilot: 2 sensors in a zone that rarely blocks, 2 in a zone that often does'><rect id='bg' x='0' y='0' width='760' height='412' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Pilot: 2 sensors in a zone that rarely blocks, 2 in a zone that often does</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Four sensors are enough to test the idea behind the whole product. The zones come from the foreman's knowledge.</text><rect x='24' y='72' width='348' height='172' rx='10' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='40' y='98' font-size='14' font-weight='700' fill='#1f2328' text-anchor='start'>Zone 1 · rarely blocks</text><text x='40' y='116' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>picked by Samuel Routhier (Chambly)</text><circle cx='64' cy='142' r='2' fill='#1f2328'/><path d='M60 138 a5.5 5.5 0 0 1 8 0 M57.5 135.5 a9 9 0 0 1 13 0' fill='none' stroke='#1f2328' stroke-width='1.3'/><text x='64' y='164' font-size='10.5' font-weight='600' fill='#1f2328' text-anchor='middle'>sensor 1</text><circle cx='134' cy='142' r='2' fill='#1f2328'/><path d='M130 138 a5.5 5.5 0 0 1 8 0 M127.5 135.5 a9 9 0 0 1 13 0' fill='none' stroke='#1f2328' stroke-width='1.3'/><text x='134' y='164' font-size='10.5' font-weight='600' fill='#1f2328' text-anchor='middle'>sensor 2</text><path d='M204 172 H356' fill='none' stroke='#d0d7de' stroke-width='1.25'/><path d='M204 172 C224 172 230 158 242 158 C254 158 258 172 274 172 H356' fill='none' stroke='#1a7f37' stroke-width='2'/><path d='M204 172 C224 172 230 162 242 162 C254 162 258 172 274 172 H356' fill='none' stroke='#1a7f37' stroke-width='2'/><text x='204' y='188' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>quick drain, small rise</text><text x='204' y='202' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>expected after a rain</text><text x='40' y='206' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>2 basins Samuel knows</text><text x='40' y='222' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>same zone, similar conditions</text><rect x='388' y='72' width='348' height='172' rx='10' fill='none' stroke='#d0d7de' stroke-width='1.25'/><text x='404' y='98' font-size='14' font-weight='700' fill='#1f2328' text-anchor='start'>Zone 2 · often blocks</text><text x='404' y='116' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>picked by Samuel Routhier (Chambly)</text><circle cx='428' cy='142' r='2' fill='#1f2328'/><path d='M424 138 a5.5 5.5 0 0 1 8 0 M421.5 135.5 a9 9 0 0 1 13 0' fill='none' stroke='#1f2328' stroke-width='1.3'/><text x='428' y='164' font-size='10.5' font-weight='600' fill='#1f2328' text-anchor='middle'>sensor 3</text><circle cx='498' cy='142' r='2' fill='#1f2328'/><path d='M494 138 a5.5 5.5 0 0 1 8 0 M491.5 135.5 a9 9 0 0 1 13 0' fill='none' stroke='#1f2328' stroke-width='1.3'/><text x='498' y='164' font-size='10.5' font-weight='600' fill='#1f2328' text-anchor='middle'>sensor 4</text><path d='M568 172 H720' fill='none' stroke='#d0d7de' stroke-width='1.25'/><path d='M568 172 C588 172 594 134 608 134 C648 134 678 162 720 166' fill='none' stroke='#cf222e' stroke-width='2'/><path d='M568 172 C588 172 594 138 608 138 C648 138 678 162 720 166' fill='none' stroke='#cf222e' stroke-width='2'/><text x='568' y='188' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>slow drain, high rise</text><text x='568' y='202' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='start'>expected after a rain</text><text x='404' y='206' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>2 basins Samuel knows</text><text x='404' y='222' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>same zone, similar conditions</text><text x='24' y='276' font-size='11' font-weight='700' fill='#57606a' text-anchor='start'>WHAT THE PILOT ANSWERS</text><circle cx='36' cy='304' r='12' fill='#0969da' fill-opacity='0.12' stroke='#0969da'/><text x='36' y='308.5' font-size='12' font-weight='700' fill='#1f2328' text-anchor='middle'>1</text><text x='56' y='304' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Do the 2 sensors in a zone agree?</text><text x='56' y='320' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>tests "one sensor speaks for a zone"</text><circle cx='400' cy='304' r='12' fill='#0969da' fill-opacity='0.12' stroke='#0969da'/><text x='400' y='308.5' font-size='12' font-weight='700' fill='#1f2328' text-anchor='middle'>2</text><text x='420' y='304' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Do the 2 zones look clearly different?</text><text x='420' y='320' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>tests the drainage diagnosis</text><circle cx='36' cy='356' r='12' fill='#0969da' fill-opacity='0.12' stroke='#0969da'/><text x='36' y='360.5' font-size='12' font-weight='700' fill='#1f2328' text-anchor='middle'>3</text><text x='56' y='356' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Does zone 2 flag before crews find it full?</text><text x='56' y='372' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>tests the early warning</text><circle cx='400' cy='356' r='12' fill='#0969da' fill-opacity='0.12' stroke='#0969da'/><text x='400' y='360.5' font-size='12' font-weight='700' fill='#1f2328' text-anchor='middle'>4</text><text x='420' y='356' font-size='12' font-weight='600' fill='#1f2328' text-anchor='start'>Do the public-data factors rank zone 2 higher?</text><text x='420' y='372' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>tests the zoning data, with no field work</text></svg>