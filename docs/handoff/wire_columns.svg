<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 500' width='760' height='500' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Everything else lives in the right-hand column, not on new pages'><rect id='bg' x='0' y='0' width='760' height='500' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><pattern id='hatch-urgent' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#cf222e' fill-opacity='0.22'/></pattern><pattern id='hatch-inspect' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='3' height='8' fill='#bc4c00' fill-opacity='0.22'/></pattern></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Everything else lives in the right-hand column, not on new pages</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Three states of the same column. The page count stays at three: role picker, map page, crew screen.</text><text x='24' y='82' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='start'>Foreman · Lots tab</text><rect x='24' y='92' width='220' height='384' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='270' y='82' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='start'>Anyone · a basin clicked</text><rect x='270' y='92' width='220' height='384' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='516' y='82' font-size='11.5' font-weight='600' fill='#57606a' text-anchor='start'>Engineering · Modifier tab</text><rect x='516' y='92' width='220' height='384' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='38' y='118' font-size='14' font-weight='700' fill='#1f2328' text-anchor='start'>Lot du mar. 18 nov.</text><text x='38' y='146' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>Équipe</text><rect x='38' y='152' width='192' height='22' rx='6' fill='none' stroke='#d0d7de'/><text x='46' y='167' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>Sani-Vac ▾</text><text x='38' y='190' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>Durée</text><rect x='38' y='196' width='192' height='22' rx='6' fill='none' stroke='#d0d7de'/><text x='46' y='211' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>½ journée (4 h)</text><text x='38' y='234' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>Zones</text><rect x='38' y='240' width='192' height='22' rx='6' fill='none' stroke='#d0d7de'/><text x='46' y='255' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>B (31) + D (2 de 29)</text><rect x='38' y='278' width='192' height='12' rx='6' fill='#d0d7de'/><rect x='38' y='278' width='184' height='12' rx='6' fill='#0969da'/><text x='38' y='306' font-size='11' font-weight='600' fill='#1f2328' text-anchor='start'>3 h 50 sur 4 h · 33 puisards</text><rect x='38' y='318' width='192' height='34' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='134.0' y='339.0' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle'>Imprimer la feuille</text><rect x='38' y='360' width='192' height='34' rx='10' fill='#0969da' stroke='#0969da' stroke-width='1.5'/><text x='134.0' y='381.0' font-size='12' font-weight='700' fill='#ffffff' text-anchor='middle'>Envoyer à l'équipe</text><text x='38' y='420' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>Après : « tous nettoyés »,</text><text x='38' y='436' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>puis décocher les exceptions</text><path d='M292 105.65 L301.9 123.65 L282.1 123.65 Z' fill='#cf222e' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round'/><rect x='290.8' y='111.95' width='2.4' height='6.3' fill='#ffffff'/><circle cx='292' cy='120.5' r='1.4' fill='#ffffff'/><text x='308' y='121' font-size='13' font-weight='700' fill='#1f2328' text-anchor='start'>Puisard B-14 · capteur</text><text x='284' y='150' font-size='10' font-weight='700' fill='#57606a' text-anchor='start'>OBSERVÉ</text><text x='284' y='167' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>reste haut 35 min après la pluie</text><text x='284' y='192' font-size='10' font-weight='700' fill='#57606a' text-anchor='start'>CAUSE PROBABLE</text><text x='284' y='209' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>sédiments à la cloche</text><text x='284' y='234' font-size='10' font-weight='700' fill='#57606a' text-anchor='start'>PROCHAINE ÉTAPE</text><text x='284' y='251' font-size='11.5' font-weight='400' fill='#1f2328' text-anchor='start'>nettoyer avant 18 h</text><rect x='284' y='274' width='192' height='48' rx='8' fill='none' stroke='#d0d7de'/><text x='294' y='292' font-size='10' font-weight='700' fill='#57606a' text-anchor='start'>NIVEAU D'EAU</text><text x='294' y='311' font-size='13' font-weight='700' fill='#1a7f37' text-anchor='start'>1,31 m sous la rue</text><rect x='284' y='330' width='192' height='48' rx='8' fill='none' stroke='#d0d7de'/><text x='294' y='348' font-size='10' font-weight='700' fill='#57606a' text-anchor='start'>DRAINAGE</text><text x='294' y='367' font-size='13' font-weight='700' fill='#bc4c00' text-anchor='start'>lent · ~35 % (estimé)</text><text x='284' y='408' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='start'>▸ Historique, coupe, journal</text><text x='284' y='436' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>Sans capteur : on montre l'état</text><text x='284' y='452' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>de sa zone, en contour</text><rect x='530' y='108' width='192' height='34' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.5'/><text x='626.0' y='129.0' font-size='12' font-