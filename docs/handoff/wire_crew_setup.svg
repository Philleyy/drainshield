<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 576' width='760' height='576' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' role='img' aria-label='Crew tablet and add-basin form: few fields, big targets'><rect id='bg' x='0' y='0' width='760' height='576' fill='#ffffff'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Crew tablet and add-basin form: few fields, big targets</text><text x='24' y='52' font-size='11.5' fill='#57606a'>Left: the crew follows a run; the sensor closes each stop. Right: as-built inputs with a live drawing.</text><rect x='24' y='72' width='340' height='480' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><rect x='24' y='72' width='340' height='26' rx='10' fill='#eef1f4'/><rect x='24' y='88' width='340' height='10' fill='#eef1f4'/><text x='36' y='89' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>Crew view (tablet)</text><text x='40' y='124' font-size='15' font-weight='600' fill='#1f2328' text-anchor='start'>Today's run · 3 stops</text><text x='40' y='144' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>leave the yard 13:00 · rain at 20:00</text><rect x='40' y='160' width='308' height='72' rx='8' fill='#cf222e' fill-opacity='0.08' stroke='#cf222e'/><text x='54' y='184' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>1  PILOT-A</text><text x='54' y='202' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>arrive 13:20 · vacuum the sump</text><text x='54' y='220' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='start'>Navigate ·  Log</text><text x='336' y='184' font-size='11.5' font-weight='600' fill='#1a7f37' text-anchor='end'>✓ auto</text><rect x='40' y='244' width='308' height='72' rx='8' fill='#cf222e' fill-opacity='0.08' stroke='#cf222e'/><text x='54' y='268' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>2  PILOT-B</text><text x='54' y='286' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>arrive 13:55 · vacuum the sump</text><text x='54' y='304' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='start'>Navigate ·  Log</text><text x='336' y='268' font-size='11.5' font-weight='600' fill='#1a7f37' text-anchor='end'></text><rect x='40' y='328' width='308' height='72' rx='8' fill='#bc4c00' fill-opacity='0.08' stroke='#bc4c00'/><text x='54' y='352' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>3  PILOT-C</text><text x='54' y='370' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>arrive 14:30 · inspect the trap</text><text x='54' y='388' font-size='11.5' font-weight='600' fill='#0969da' text-anchor='start'>Navigate ·  Log</text><text x='336' y='352' font-size='11.5' font-weight='600' fill='#1a7f37' text-anchor='end'></text><text x='40' y='430' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Stops tick themselves off when the sensor</text><text x='40' y='446' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>sees the sump emptied. Nothing to tap.</text><rect x='40' y='466' width='308' height='70' rx='8' fill='#eef1f4'/><text x='194' y='506' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='middle'>route map</text><rect x='396' y='72' width='340' height='480' rx='10' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><rect x='396' y='72' width='340' height='26' rx='10' fill='#eef1f4'/><rect x='396' y='88' width='340' height='10' fill='#eef1f4'/><text x='408' y='89' font-size='10.5' font-weight='600' fill='#57606a' text-anchor='start'>Add basin (engineering)</text><text x='412' y='112' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Basin</text><rect x='412' y='118' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='135' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>pick on the city map or type</text><text x='412' y='158' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Inside diameter</text><rect x='412' y='164' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='181' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>610 mm (24") ▾</text><text x='412' y='204' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Outlet invert depth</text><rect x='412' y='210' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='227' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>1400 mm · blank = learn it</text><text x='412' y='250' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Outlet pipe</text><rect x='412' y='256' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='273' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>250 mm ▾</text><text x='412' y='296' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Sump</text><rect x='412' y='302' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='319' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>0 | 300 | 500 mm</text><text x='412' y='342' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Sensor depth</text><rect x='412' y='348' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='365' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>400 mm</text><text x='412' y='388' font-size='11' font-weight='600' fill='#57606a' text-anchor='start'>Cast-iron trap</text><rect x='412' y='394' width='176' height='26' rx='6' fill='none' stroke='#d0d7de'/><text x='420' y='411' font-size='11' font-weight='400' fill='#1f2328' text-anchor='start'>☑ installed</text><rect x='604' y='112' width='116' height='300' rx='8' fill='#eef1f4'/><rect x='632' y='140' width='60' height='240' fill='#ffffff' stroke='#8c959f'/><rect x='632' y='344' width='60' height='36' fill='#54aeff' fill-opacity='0.35'/><text x='662' y='400' font-size='10.5' font-weight='400' fill='#57606a' text-anchor='middle'>live preview</text><rect x='412' y='450' width='120' height='32' rx='8' fill='#0969da'/><text x='472' y='471' font-size='12' font-weight='600' fill='#ffffff' text-anchor='middle'>Save basin</text><text x='412' y='506' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>Asks only what the city's as-built</text><text x='412' y='522' font-size='11.5' font-weight='400' fill='#57606a' text-anchor='start'>plans show. No catalogue models.</text></svg>